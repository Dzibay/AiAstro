# TLS снимает Caddy: схему и хост берём из его заголовков, а не из соединения Caddy → nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Адрес сайта для canonical, og:url, sitemap и robots: подставляется на лету из Host, без отдельной настройки.
map $http_x_forwarded_host $public_host {
    default $http_x_forwarded_host;
    ''      $host;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    sub_filter_once off;
    sub_filter_types text/plain application/xml;
    sub_filter '__ORIGIN__' '$forwarded_proto://$public_host';

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Файлы сборки Vite с хешем в имени: кэшируем надолго, отсутствующие — 404, а не index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Арт из frontend/public/assets/astral копируется без хешей — кэш на сутки.
    location /assets/astral/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Иконки лежат без хешей.
    location ~* ^/(favicon\.ico|favicon\.svg|favicon-96x96\.png|apple-touch-icon\.png|web-app-manifest-.*\.png|site\.webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA-фолбэк для vue-router в history mode.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
