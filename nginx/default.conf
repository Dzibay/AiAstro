# TLS снимает Caddy: схему и хост берём из его заголовков, а не из соединения Caddy → nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Файлы сборки Vite с хешем в имени: кэшируем надолго, отсутствующие — 404, а не index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Арт из frontend/public/assets/astral копируется без хешей — кэш на сутки.
    location /assets/astral/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA-фолбэк для vue-router в history mode.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
